<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="form-body">
  <header class="site-header">
    <a class="brand-mark" href="index.html">
      <span>CC</span>
      <strong>Campus Current</strong>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="signup.html">Signup</a>
      <a href="dashboard.html">Marketplace</a>
      <a href="#help">Help</a>
    </nav>
  </header>

  <main class="auth-shell">
    <section class="auth-panel">
      <p class="eyebrow">Welcome back</p>
      <h1>Enter the marketplace.</h1>
      <p>Login to browse listings, post what you want to buy or sell, and continue conversations.</p>

      <input type="email" id="email" placeholder="College Email">
      <input type="password" id="password" placeholder="Password">
      <button type="button" class="button primary auth-button" onclick="login()">Login</button>
      <p>New user? <a href="signup.html">Create an account</a></p>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
